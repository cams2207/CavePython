<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Ma Cave à Vin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-sm w-full bg-white p-6 rounded-2xl shadow-lg space-y-4 border border-gray-100">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-[#7D1242]">🍷</h1>
            <h2 class="text-xl font-bold text-[#7D1242] mt-1">Ma Cave à Vin</h2>
            <p class="text-xs text-gray-500">Connexion à votre espace</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 rounded-lg text-xs bg-red-100 text-red-700">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-600">Identifiant</label>
                <input type="text" name="username" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-[#7D1242]" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600">Mot de passe</label>
                <input type="password" name="password" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-[#7D1242]" required>
            </div>
            <button type="submit" class="w-full bg-[#7D1242] text-white py-3 rounded-xl font-bold shadow-md">
                Se connecter
            </button>
        </form>
    </div>
</body>
</html>
