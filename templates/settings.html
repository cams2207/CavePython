{% extends "layout.html" %}
{% block content %}
<div class="space-y-4">
    <h2 class="text-2xl font-bold text-[#7D1242]">Réglages des Emplacements</h2>
    <form action="{{ url_for('settings') }}" method="POST" class="bg-white p-4 rounded-xl shadow-sm space-y-3">
        {% for loc in locations %}
        <div>
            <label class="block text-xs font-semibold text-gray-600">Emplacement {{ loop.index }}</label>
            <input type="text" name="locations" value="{{ loc }}" class="w-full border rounded p-2 text-sm font-bold text-[#7D1242]" required>
        </div>
        {% endfor %}
        <button type="submit" class="w-full bg-[#7D1242] text-white py-3 rounded-xl font-bold shadow-md mt-4">
            Mettre à jour les emplacements
        </button>
    </form>
</div>
{% endblock %}
