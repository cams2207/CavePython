{% extends "layout.html" %}
{% block content %}
<div class="space-y-4">
    <h2 class="text-2xl font-bold text-[#7D1242]">Ajouter un Vin</h2>
    <form action="{{ url_for('add_wine') }}" method="POST" class="bg-white p-4 rounded-xl shadow-sm space-y-3">
        <div>
            <label class="block text-xs font-semibold text-gray-600">Région</label>
            <input type="text" name="region" class="w-full border rounded p-2 text-sm">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-600">Domaine</label>
            <input type="text" name="domaine" class="w-full border rounded p-2 text-sm" required>
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-600">Nom du Vin</label>
            <input type="text" name="vin" class="w-full border rounded p-2 text-sm" required>
        </div>
        <div class="grid grid-cols-3 gap-2">
            <div>
                <label class="block text-xs font-semibold text-gray-600">Millésime</label>
                <input type="number" name="millesime" value="2020" class="w-full border rounded p-2 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600">Boire Min</label>
                <input type="number" name="boire_min" value="2024" class="w-full border rounded p-2 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600">Boire Max</label>
                <input type="number" name="boire_max" value="2030" class="w-full border rounded p-2 text-sm">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="block text-xs font-semibold text-gray-600">Prix Unit. (PU)</label>
                <input type="text" name="pu" class="w-full border rounded p-2 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600">Date d'achat</label>
                <input type="text" name="date" class="w-full border rounded p-2 text-sm">
            </div>
        </div>

        <hr class="my-2">
        <h3 class="font-bold text-sm text-gray-700">Répartition par cave :</h3>
        {% for loc in locations %}
        <div>
            <label class="block text-xs text-gray-500">{{ loc }}</label>
            <input type="number" step="1" name="qty_{{ loc }}" value="0" class="w-full border rounded p-2 text-sm">
        </div>
        {% endfor %}

        <button type="submit" class="w-full bg-[#7D1242] text-white py-3 rounded-xl font-bold shadow-md mt-4">
            ➕ Ajouter à la cave
        </button>
    </form>
</div>
{% endblock %}
