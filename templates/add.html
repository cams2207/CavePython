{% extends "layout.html" %}
{% block content %}
<div class="space-y-4">
    <div>
        <h2 class="font-serif text-2xl font-bold text-gradient">Nouveau Vin</h2>
        <p class="text-xs text-gray-400">Ajouter une cuvée à votre cave</p>
    </div>

    <form action="{{ url_for('add_wine') }}" method="POST" class="glass-card p-4.5 rounded-2xl space-y-3.5 border border-wine-200/10 shadow-2xl">
        
        <div>
            <label class="block text-[11px] font-semibold text-gray-300 mb-1">Région</label>
            <input list="regions_list" name="region" placeholder="Sélectionnez ou tapez..." class="w-full bg-wine-900/80 border border-wine-200/20 rounded-xl p-2.5 text-xs text-white focus:border-gold-500" required>
            <datalist id="regions_list">
                {% for r in regions %}
                <option value="{{ r }}">
                {% endfor %}
            </datalist>
        </div>

        <div>
            <label class="block text-[11px] font-semibold text-gray-300 mb-1">Domaine / Château</label>
            <input list="domaines_list" name="domaine" placeholder="Sélectionnez ou tapez..." class="w-full bg-wine-900/80 border border-wine-200/20 rounded-xl p-2.5 text-xs text-white focus:border-gold-500" required>
            <datalist id="domaines_list">
                {% for d in domaines %}
                <option value="{{ d }}">
                {% endfor %}
            </datalist>
        </div>

        <div>
            <label class="block text-[11px] font-semibold text-gray-300 mb-1">Nom du Vin / Appellation</label>
            <input type="text" name="vin" placeholder="Ex: Grand Cru Classé, Cuvée Prestige..." class="w-full bg-wine-900/80 border border-wine-200/20 rounded-xl p-2.5 text-xs text-white focus:border-gold-500" required>
        </div>

        <div class="grid grid-cols-3 gap-2">
            <div>
                <label class="block text-[10px] font-semibold text-gray-300 mb-1">Millésime</label>
                <input type="number" name="millesime" value="2020" class="w-full bg-wine-900/80 border border-wine-200/20 rounded-xl p-2 text-xs text-white text-center">
            </div>
            <div>
                <label class="block text-[10px] font-semibold text-gray-300 mb-1">Boire Min</label>
                <input type="number" name="boire_min" value="2024" class="w-full bg-wine-900/80 border border-wine-200/20 rounded-xl p-2 text-xs text-white text-center">
            </div>
            <div>
                <label class="block text-[10px] font-semibold text-gray-300 mb-1">Boire Max</label>
                <input type="number" name="boire_max" value="2030" class="w-full bg-wine-900/80 border border-wine-200/20 rounded-xl p-2 text-xs text-white text-center">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="block text-[11px] font-semibold text-gray-300 mb-1">Prix Unitaire (PU)</label>
                <input type="text" name="pu" placeholder="Ex: 35€" class="w-full bg-wine-900/80 border border-wine-200/20 rounded-xl p-2.5 text-xs text-white">
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-gray-300 mb-1">Statut</label>
                <select name="statut" class="w-full bg-wine-900/80 border border-wine-200/20 rounded-xl p-2.5 text-xs text-gold-300 font-bold focus:border-gold-500">
                    <option value="A boire">À boire</option>
                    <option value="Garde">Garde</option>
                    <option value="Apogée">Apogée</option>
                </select>
            </div>
        </div>

        <div class="pt-2 border-t border-wine-200/10">
            <h3 class="text-xs font-bold text-gold-300 mb-2">📍 Stock initial par emplacement :</h3>
            <div class="grid grid-cols-3 gap-2">
                {% for loc in locations %}
                <div class="bg-wine-950/60 p-2 rounded-xl border border-wine-500/10 text-center">
                    <label class="block text-[10px] text-gray-400 font-medium truncate mb-1">{{ loc }}</label>
                    <input type="number" step="1" name="qty_{{ loc }}" value="0" class="w-full bg-wine-900 border border-wine-200/20 rounded-lg p-1.5 text-center text-xs font-bold text-gold-300">
                </div>
                {% endfor %}
            </div>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-gold-600 to-gold-500 text-wine-950 py-3 rounded-xl font-extrabold text-xs shadow-lg shadow-gold-500/20 hover:brightness-110">
            ➕ Ajouter à la cave
        </button>
    </form>
</div>
{% endblock %}
